name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          RATE_LIMIT_STORE: redis
          REDIS_URL: redis://localhost:6380

      - name: Audit production dependencies
        working-directory: backend
        # Gate on any NEW high not in the accepted set. adm-zip/sharp (and
        # their dependents) arrive via @huggingface/transformers with no
        # upstream fix — accepted risk, see DEEP_CODE_REVIEW resolution log.
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e "
            const v = require('./audit.json').vulnerabilities || {};
            const accepted = new Set(['@huggingface/transformers','onnxruntime-node','adm-zip','sharp']);
            const bad = Object.entries(v).filter(([k, x]) => x.severity === 'high' && !accepted.has(k)).map(([k]) => k);
            if (bad.length) { console.error('NEW high-severity vulnerabilities:', bad.join(', ')); process.exit(1); }
            console.log('audit ok — accepted highs:', [...accepted].filter(k => v[k]).join(', '));
          "
          rm -f audit.json

  frontend-test:

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run tests
        working-directory: frontend
        run: npm test

  pdf-processor-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pdf-processor/requirements.txt

      - name: Install dependencies
        working-directory: pdf-processor
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        working-directory: pdf-processor
        run: python -m pytest tests/ -q
